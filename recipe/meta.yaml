{% set name = "aiosqlite" %}
{% set version = "0.22.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 043e0bd78d32888c0a9ca90fc788b38796843360c855a7262a532813133a0650

build:
  number: 0
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation . -vv

requirements:
  host:
    - python
    - pip
    - flit-core >=3.8,<4
  run:
    - python

test:
  source_files:
    - aiosqlite/tests
  imports:
    - aiosqlite
  requires:
    - pip
  commands:
    - pip check
    - python -m unittest -v aiosqlite/tests/smoke.py

about:
  home: https://github.com/omnilib/aiosqlite
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: asyncio bridge to the standard sqlite3 module
  description: |
    AsyncIO bridge to the standard sqlite3 module for Python 3.5+.
  dev_url: https://github.com/omnilib/aiosqlite
  doc_url: https://aiosqlite.omnilib.dev

extra:
  recipe-maintainers:
    - carlodri
