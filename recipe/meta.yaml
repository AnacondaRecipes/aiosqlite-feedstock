{% set name = "aiosqlite" %}
{% set version = "0.22.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7e9e52d72b319fcdeac727668975056c49720c995176dc57370935e5ba162bb9

build:
  number: 0
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation . -vv

requirements:
  host:
    - python
    - pip
    - flit-core >=3.8,<4
  run:
    - python
    - typing_extensions >=4.0

test:
  imports:
    - aiosqlite
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/omnilib/aiosqlite
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: asyncio bridge to the standard sqlite3 module
  description: |
    AsyncIO bridge to the standard sqlite3 module for Python 3.5+.
  dev_url: https://github.com/omnilib/aiosqlite
  doc_url: https://aiosqlite.omnilib.dev/

extra:
  recipe-maintainers:
    - carlodri
